services:
  nixie:
    image: 'ghcr.io/shishantbiswas/nxc:latest'
    volumes:
      - './data:/app/dist/data'
    ports:
      - 3000:3000
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:3000'
      interval: 15s
      timeout: 5s
      retries: 3
